services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_backend_laravel
    image: laravel-app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - eventos-net

  frontend:
    build:
      context: ./frontend
    container_name: gestion_frontend_vue
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobrescribir los node_modules del contenedor con los locales si no existen
    networks:
      - eventos-net
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda con el hot reload en desarrollo local

  db:
    image: postgres:latest
    container_name: gestion_postgres_db
    restart: always
    environment:
      POSTGRES_DB: db_events
      POSTGRES_USER: cfchm_user
      POSTGRES_PASSWORD: cfchm_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - eventos-net

networks:
  eventos-net:
    driver: bridge

volumes:
  db_data:
