services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestion_backend_laravel
    image: laravel-app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
    networks:
      - eventos-net

  frontend:
    build:
      context: ./frontend
    container_name: gestion_frontend_vue
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobrescribir los node_modules del contenedor con los locales si no existen
    networks:
      - eventos-net
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda con el hot reload en desarrollo local

  db:
    image: mysql:8.4
    container_name: gestion_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: db_events
      MYSQL_USER: cfchm_user
      MYSQL_PASSWORD: cfchm_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - eventos-net

networks:
  eventos-net:
    driver: bridge

volumes:
  db_data:
